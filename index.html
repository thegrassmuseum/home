<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>welcome to the grass museum</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      color: black;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* stage wraps the PRE so we can overlay invisible clickable areas */
    #stage {
      position: relative;
      display: inline-block;
      --lh: 1.2em; /* keep in sync with #container line-height */
    }

    /* Put the text in a PRE so spacing/newlines are guaranteed */
    #container {
      font-size: 14px;
      line-height: 1.2; /* prevents vertical “drift” */
      margin: 0;
      white-space: pre;
      text-align: left;
      user-select: none; /* optional: prevents accidental selection */
    }

    /* Invisible hotspot aligned to the GALLERY box (does not affect layout) */
    #galleryHotspot {
      position: absolute;
      top: 0;
      left: 6ch;
      width: 21ch;
      height: calc(6 * var(--lh));
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: none;           /* enabled only when map is fully shown */
      pointer-events: none;
    }

    /* Invisible hotspot aligned to the GIFT SHOP box (does not affect layout) */
    #giftHotspot {
      position: absolute;
      top: calc(11 * var(--lh));
      left: 6ch;
      width: 21ch;
      height: calc(6 * var(--lh));
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: none;           /* enabled only when map is fully shown */
      pointer-events: none;
    }

    /* Invisible hotspot aligned to the GARDEN label (does not affect layout) */
    #gardenHotspot {
      position: absolute;
      top: calc(7.5 * var(--lh));
      left: 27ch;
      width: 6ch;
      height: calc(1 * var(--lh));
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: none;           /* enabled only when map is fully shown */
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="stage">
    <pre id="container"></pre>
    <a id="galleryHotspot" href="gallery.html" aria-label="Enter Gallery"></a>
    <a id="giftHotspot" href="gift-shop.html" aria-label="Enter Gift Shop"></a>
    <a id="gardenHotspot" href="garden.html" aria-label="Enter Garden"></a>
  </div>

  <script>
    const container = document.getElementById("container");
    const galleryHotspot = document.getElementById("galleryHotspot");
    const giftHotspot = document.getElementById("giftHotspot");
    const gardenHotspot = document.getElementById("gardenHotspot");

    const introText = "welcome to the grass museum";
    const enteringText = "entering...";

    const asciiMap =
".       ┌───────────────────┐       .\n" +
"        │                   │\n" +
"        │      GALLERY      │\n" +
"        │        ↑          │\n" +
"        │                   │\n" +
"        └────────┬──────────┘\n" +
"                 │\n" +
"                 │\n" +
"                 │\n" +
"EXIT───────────◄───►────────────GARDEN\n" +
"                 │\n" +
"                 │\n" +
"                 │\n" +
"        ┌────────┴──────────┐\n" +
"        │                   │\n" +
"        │     GIFT SHOP     │\n" +
"        │        ↓          │\n" +
"        │                   │\n" +
".       └───────────────────┘       .";

    // Speeds (ms per character). Adjust to taste.
    const MAP_SPEED = 1;     // progressive but fast
    const ERASE_FAST = 1;    // fast erase for transitions

    let currentInterval = null;
    let atMap = false;
    let transitioning = false;

    function clearTyping() {
      if (currentInterval) {
        clearInterval(currentInterval);
        currentInterval = null;
      }
    }

    function setHotspotsEnabled(enabled) {
      galleryHotspot.style.display = enabled ? "block" : "none";
      galleryHotspot.style.pointerEvents = enabled ? "auto" : "none";

      giftHotspot.style.display = enabled ? "block" : "none";
      giftHotspot.style.pointerEvents = enabled ? "auto" : "none";

      gardenHotspot.style.display = enabled ? "block" : "none";
      gardenHotspot.style.pointerEvents = enabled ? "auto" : "none";
    }

    function showMapInstant() {
      clearTyping();
      container.textContent = asciiMap;
      atMap = true;
      transitioning = false;
      setHotspotsEnabled(true);
    }

    function typeIn(text, speed, callback) {
      clearTyping();
      container.textContent = "";
      let i = 0;
      currentInterval = setInterval(() => {
        container.textContent += text[i] ?? "";
        i++;
        if (i >= text.length) {
          clearTyping();
          if (callback) setTimeout(callback, 700);
        }
      }, Math.max(0, speed));
    }

    function typeOut(speed, callback) {
      clearTyping();
      let text = container.textContent;
      let i = text.length;
      currentInterval = setInterval(() => {
        text = text.slice(0, i - 1);
        container.textContent = text;
        i--;
        if (i <= 0) {
          clearTyping();
          if (callback) setTimeout(callback, 120);
        }
      }, Math.max(0, speed));
    }

    function transitionTo(href, message) {
      if (!atMap || transitioning) return;
      transitioning = true;
      setHotspotsEnabled(false);

      typeOut(ERASE_FAST, () => {
        typeIn(message, 35, () => {
          setTimeout(() => {
            window.location.href = href;
          }, 250);
        });
      });
    }

    // Skip intro only BEFORE the map is fully shown (Enter, click, tap)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !atMap && !transitioning) showMapInstant();
    });

    document.addEventListener("click", () => {
      if (!atMap && !transitioning) showMapInstant();
    });

    document.addEventListener("touchstart", () => {
      if (!atMap && !transitioning) showMapInstant();
    }, { passive: true });

    // Hotspots: fast erase, show message, then redirect
    galleryHotspot.addEventListener("click", (e) => {
      e.preventDefault();
      transitionTo(galleryHotspot.getAttribute("href"), "entering gallery...");
    });

    giftHotspot.addEventListener("click", (e) => {
      e.preventDefault();
      transitionTo(giftHotspot.getAttribute("href"), "entering gift shop...");
    });

    gardenHotspot.addEventListener("click", (e) => {
      e.preventDefault();
      transitionTo(gardenHotspot.getAttribute("href"), "entering garden...");
    });

    // Start with hotspots disabled
    setHotspotsEnabled(false);

    // Intro sequence, then TYPE the map in progressively
    typeIn(introText, 80, () => {
      typeOut(50, () => {
        typeIn(enteringText, 50, () => {
          typeOut(50, () => {
            typeIn(asciiMap, MAP_SPEED, () => {
              atMap = true;
              transitioning = false;
              setHotspotsEnabled(true);
            });
          });
        });
      });
    });
  </script>
</body>
</html>
