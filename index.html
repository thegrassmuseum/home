<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>welcome to the grass museum</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      color: black;
      /* Use a monospace stack that usually renders box drawing correctly */
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Put the text in a PRE so spacing/newlines are guaranteed */
    #container {
      font-size: 14px;
      line-height: 1.2;   /* prevents vertical “drift” */
      margin: 0;
      white-space: pre;   /* redundant with <pre>, but harmless */
      text-align: left;
    }
  </style>
</head>
<body>
  <pre id="container"></pre>

<script>
  const container = document.getElementById("container");

  const introText = "welcome to the grass museum";
  const enteringText = "entering...";

  const asciiMap =
".       ┌───────────────────┐       .\n" +
"        │                   │\n" +
"        │      GALLERY      │\n" +
"        │        ↑          │\n" +
"        │                   │\n" +
"        └────────┬──────────┘\n" +
"                 │\n" +
"                 │\n" +
"                 │\n" +
"EXIT───────────◄───►────────────GARDEN\n" +
"                 │\n" +
"                 │\n" +
"                 │\n" +
"        ┌────────┴──────────┐\n" +
"        │                   │\n" +
"        │     GIFT SHOP     │\n" +
"        │        ↓          │\n" +
"        │                   │\n" +
".       └───────────────────┘       .";

  let currentInterval = null;
  let skipped = false;

  function clearTyping() {
    if (currentInterval) {
      clearInterval(currentInterval);
      currentInterval = null;
    }
  }

  function skipToMap() {
    if (skipped) return;
    skipped = true;
    clearTyping();
    container.textContent = asciiMap;
  }

  function typeIn(text, speed, callback) {
    clearTyping();
    container.textContent = "";
    let i = 0;
    currentInterval = setInterval(() => {
      container.textContent += text[i] ?? "";
      i++;
      if (i >= text.length) {
        clearTyping();
        if (callback) setTimeout(callback, 400);
      }
    }, speed);
  }

  function typeOut(speed, callback) {
    clearTyping();
    let text = container.textContent;
    let i = text.length;
    currentInterval = setInterval(() => {
      text = text.slice(0, i - 1);
      container.textContent = text;
      i--;
      if (i <= 0) {
        clearTyping();
        if (callback) setTimeout(callback, 300);
      }
    }, speed);
  }

  // INPUT LISTENERS (Enter, click, tap)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") skipToMap();
  });

  document.addEventListener("click", skipToMap);
  document.addEventListener("touchstart", skipToMap, { passive: true });

  // ORIGINAL SEQUENCE
  typeIn(introText, 80, () => {
    typeOut(50, () => {
      typeIn(enteringText, 50, () => {
        typeOut(50, () => {
          typeIn(asciiMap, 0.5, null);
        });
      });
    });
  });
</script>
</body>
</html>
