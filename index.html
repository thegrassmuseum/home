<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>the grass museum</title>
  <style>
    /* Reset basic margins */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Full white background, center content */
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Times New Roman", Times, serif;
    }

    /* Wrapper for the button, so we can animate fade-in on load */
    .fade-in {
      opacity: 0;
      animation: fadeIn 6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Button text */
    .museum-button {
      position: relative;
      border: none;
      background: none;
      cursor: pointer;
      font-family: "Times New Roman", Times, serif;
      font-size: 0.8vw; /* change this to adjust size */
      color: #000000;
      text-transform: lowercase;
      outline: none;
      padding: 0;
    }

    .museum-button span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }

    .museum-button .label-main {
      opacity: 1;
    }

    .museum-button .label-hover {
      opacity: 0;
    }

    .museum-button:hover .label-main {
      opacity: 0;
    }

    .museum-button:hover .label-hover {
      opacity: 1;
    }

    /* Map container (hidden at first) */
    .map-container {
      display: none;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      line-height: 1.2;
      white-space: pre;
      text-align: left;
    }

    /* For smaller screens, reduce font size a bit */
    @media (max-width: 600px) {
      .museum-button {
        font-size: 2.5rem;
      }
      .map-container {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <!-- Intro button -->
  <div class="fade-in" id="intro">
    <button class="museum-button" type="button">
      <span class="label-main">the grass museum</span>
      <span class="label-hover">enter</span>
    </button>
  </div>

  <!-- ASCII map appears after click -->
  <div id="map-container" class="map-container">
    <pre id="museum-map"></pre>
  </div>

  <script>
    const intro = document.getElementById("intro");
    const button = document.querySelector(".museum-button");
    const mapContainer = document.getElementById("map-container");
    const mapPre = document.getElementById("museum-map");

    const mapText = `
                ┌───────────────────┐
                │                   │
                │     GALLERY       │
                │        ↑          │
                │                   │
                └────────┬──────────┘
                         │
                         │
EXIT───────────────  ◄───┼───► ─────────────────GARDEN
                         │
                         │
                ┌────────┴──────────┐
                │                   │
                │        ↓          │
                │     GIFT SHOP     │
                │                   │
                └───────────────────┘
`;

    function typeMap(text, element, speed) {
      let index = 0;

      function step() {
        if (index <= text.length) {
          element.textContent = text.slice(0, index);
          index++;
          setTimeout(step, speed);
        }
      }

      step();
    }

    button.addEventListener("click", () => {
      // Hide the button
      intro.style.display = "none";

      // Show the map container
      mapContainer.style.display = "block";

      // Start typing effect
      typeMap(mapText, mapPre, 20); // 20 ms per character
    });
  </script>
</body>
</html>
