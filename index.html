<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>the grass museum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Courier New", Courier, monospace;
    padding: 2rem;
  }
  .fade-in { opacity: 0; animation: fadeIn 1s ease forwards; margin-bottom: 1rem; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .museum-button {
    position: relative;
    border: none;
    background: none;
    cursor: pointer;
    font-family: "Courier New", Courier, monospace;
    font-size: 0.9rem;
    color: #000000;
    text-transform: lowercase;
    outline: none;
    padding: 0;
  }
  .museum-button span {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.5s ease;
    white-space: nowrap;
  }
  .museum-button .label-main { opacity: 1; }
  .museum-button .label-hover { opacity: 0; }
  .museum-button:hover .label-main { opacity: 0; }
  .museum-button:hover .label-hover { opacity: 1; }
  .map-container {
    font-family: "Courier New", Courier, monospace;
    font-size: 0.9rem;
    line-height: 1.2;
    white-space: pre;
    text-align: left;
    margin-top: 1rem;
    width: 100%;
    max-width: 500px;
  }
  .image-gallery {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
    width: 100%;
    max-width: 700px;
    opacity: 0;
  }
  .image-gallery img {
    width: 18%;
    opacity: 0;
    transition: opacity 1s ease;
  }
  textarea { width: 100%; max-width: 500px; height: 200px; font-family: "Courier New", Courier, monospace; font-size: 0.9rem; margin-bottom: 1rem; }
  @media (max-width: 600px) {
    .museum-button { font-size: 2.5rem; }
    .map-container { font-size: 0.75rem; }
    textarea { font-size: 0.75rem; height: 150px; }
  }
</style>
</head>
<body>

<div class="fade-in" id="intro">
  <button class="museum-button" type="button">
    <span class="label-main">the grass museum</span>
    <span class="label-hover">enter</span>
  </button>
</div>

<textarea id="map-editor">
┌───────────────────┐
│                   │
│      GALLERY      │
│         ↑         │
│                   │
└────────┬──────────┘
         │
EXIT─────◄───►─────────────────GARDEN
         │
┌────────┴──────────┐
│                   │
│      GIFT SHOP    │
│         ↓         │
│                   │
└───────────────────┘
</textarea>
<button id="show-map-btn">Show Map</button>

<div id="map-container" class="map-container">
  <pre id="museum-map"></pre>
</div>

<div id="entering-text" class="map-container" style="display:none; font-weight:bold;"></div>

<div class="image-gallery" id="image-gallery">
  <img src="https://via.placeholder.com/150/ff7f7f/000000?text=1" alt="1">
  <img src="https://via.placeholder.com/150/7fbfff/000000?text=2" alt="2">
  <img src="https://via.placeholder.com/150/7fff7f/000000?text=3" alt="3">
  <img src="https://via.placeholder.com/150/ffff7f/000000?text=4" alt="4">
  <img src="https://via.placeholder.com/150/ff7fff/000000?text=5" alt="5">
</div>

<script>
const intro = document.getElementById("intro");
const button = document.querySelector(".museum-button");
const mapContainer = document.getElementById("map-container");
const mapPre = document.getElementById("museum-map");
const editor = document.getElementById("map-editor");
const showMapBtn = document.getElementById("show-map-btn");
const enteringText = document.getElementById("entering-text");
const imageGallery = document.getElementById("image-gallery");

// Type the map faster
function typeMap(text, element, speed=5, callback) {
  let index = 0;
  function step() {
    if (index <= text.length) {
      element.textContent = text.slice(0, index);
      index++;
      setTimeout(step, speed);
    } else if(callback) callback();
  }
  step();
}

// Delete text character by character fast
function deleteMap(element, speed=1, callback) {
  let text = element.textContent;
  let index = text.length;
  function step() {
    if (index >= 0) {
      element.textContent = text.slice(0, index);
      index--;
      setTimeout(step, speed);
    } else if(callback) callback();
  }
  step();
}

// Click the "GALLERY" word inside the map
mapPre.addEventListener("click", (e) => {
  if(e.target.textContent.includes("GALLERY")) {
    deleteMap(mapPre, 1, () => {
      mapContainer.style.display = "none";
      enteringText.style.display = "block";
      typeMap("Entering gallery...\n", enteringText, 20, () => {
        // Fade in images
        imageGallery.style.opacity = 1;
        const imgs = imageGallery.querySelectorAll("img");
        imgs.forEach((img, i) => {
          setTimeout(() => { img.style.opacity = 1; }, i*300);
        });
      });
    });
  }
});

// Show map button
showMapBtn.addEventListener("click", () => {
  intro.style.display = "none";
  mapContainer.style.display = "block";
  typeMap(editor.value, mapPre, 5);
});

// Original intro button
button.addEventListener("click", () => {
  intro.style.display = "none";
  mapContainer.style.display = "block";
  typeMap(editor.value, mapPre, 5);
});
</script>

</body>
</html>
