<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gallery — the grass museum</title>

  <style>
    :root{
      /* ===== TUNABLE TIMINGS ===== */
      --fade-duration: 6s;        /* how long each image fades in */
      --stagger-delay: 600ms;     /* wait between images (left→right) */
      --viewer-fade: 600ms;       /* viewer fade in/out */
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      color: #111;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
    }

    /* ===== PAGE LAYOUT ===== */
    .page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .strip {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      max-width: 100%;
      overflow-x: auto;
      padding: 10px 6px;
      scrollbar-width: none;
    }
    .strip::-webkit-scrollbar { display: none; }

    /* ===== THUMBNAILS ===== */
    .thumb {
      width: 280px;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      background: #f7f7f7;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;

      opacity: 0;
      transform: translateY(6px);
      animation: fadeIn var(--fade-duration) ease forwards;
      animation-delay: var(--d, 0ms);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== VIEWER ===== */
    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--viewer-fade) cubic-bezier(.16,1,.3,1);
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
    }

    .viewer[aria-hidden="false"] {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }

    .viewerImage {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.12);
      overflow: hidden;
      min-height: 360px;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .viewerImage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .info {
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.85);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .infoTop{
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      margin: 0;
      line-height: 1.2;
    }

    .meta {
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.9;
      white-space: pre-wrap;
      margin: 0;
    }

    .closeBtn{
      border: 1px solid rgba(0,0,0,.15);
      background: transparent;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
      line-height: 1;
      transition: background 120ms ease;
    }
    .closeBtn:hover { background: rgba(0,0,0,.04); }

    .hint {
      margin-top: auto;
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.4;
    }

    @media (max-width: 860px){
      .panel { grid-template-columns: 1fr; }
      .viewerImage { min-height: 280px; }
    }

    /* ===== MINI MAP (fades in after thumbnails) ===== */
    .mini-map-wrapper{
      position: fixed;
      top: 16px;
      right: 16px;
      pointer-events: none; /* only hotspots receive clicks */
      z-index: 1000;        /* above page, below viewer blur still ok */
    }

    .mini-map {
      font-size: 11px;
      line-height: 1.25;
      white-space: pre;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(.16,1,.3,1);
      margin: 0;
    }

    .mini-map.visible {
      opacity: 0.75;
    }

    /* Invisible clickable hotspot over the word "exit" */
    .mini-exit {
      position: absolute;
      /* Line 3 in the pre: "exit──┼──garden"
         line-height is 1.25, so 2.5em places us on the 3rd line cleanly */
      top: 1.5em;
      left: 0ch;
      width: 2ch;     /* "exit" */
      height: 1em;
      pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="strip" id="strip" aria-label="gallery thumbnails">
      <button class="thumb" style="--d: calc(var(--stagger-delay) * 0);" data-full="images/01.jpeg" data-title="Smog" data-text="Description here.">
        <img src="images/01.jpeg" alt="Smog thumbnail">
      </button>

      <button class="thumb" style="--d: calc(var(--stagger-delay) * 1);" data-full="images/02.jpeg" data-title="The Divine" data-text="Description here.">
        <img src="images/02.jpeg" alt="The Divine thumbnail">
      </button>

      <button class="thumb" style="--d: calc(var(--stagger-delay) * 2);" data-full="images/03.jpeg" data-title="The Room" data-text="Description here.">
        <img src="images/03.jpeg" alt="The Room thumbnail">
      </button>

      <button class="thumb" style="--d: calc(var(--stagger-delay) * 3);" data-full="images/04.jpeg" data-title="Tria" data-text="Description here.">
        <img src="images/04.jpeg" alt="Tria thumbnail">
      </button>

      <button class="thumb" style="--d: calc(var(--stagger-delay) * 4);" data-full="images/05.jpeg" data-title="Ministries" data-text="Description here.">
        <img src="images/05.jpeg" alt="Ministries thumbnail">
      </button>
    </section>
  </main>

  <!-- MINI MAP (with clickable EXIT hotspot) -->
  <div class="mini-map-wrapper" aria-hidden="true">
    <pre class="mini-map" id="miniMap">
   gallery ×
      |
exit──┼──garden
      |
  gift shop
    </pre>
    <a class="mini-exit" href="index.html" aria-label="back to vestibule"></a>
  </div>

  <!-- VIEWER -->
  <div class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-label="image viewer">
    <div class="panel" role="document">
      <div class="viewerImage">
        <img id="viewerImg" src="" alt="">
      </div>
      <aside class="info" aria-label="image details">
        <div class="infoTop">
          <h2 class="title" id="viewerTitle"></h2>
          <button class="closeBtn" id="closeBtn" aria-label="close viewer">×</button>
        </div>
        <p class="meta" id="viewerText"></p>
        <div class="hint">click outside or press esc to close</div>
      </aside>
    </div>
  </div>

  <script>
    const thumbs = document.querySelectorAll(".thumb");
    const miniMap = document.getElementById("miniMap");

    // Fade in mini-map AFTER the last thumbnail finishes its fade-in animation
    const lastThumb = thumbs[thumbs.length - 1];
    lastThumb.addEventListener("animationend", () => {
      miniMap.classList.add("visible");
    }, { once: true });

    // Viewer logic
    const viewer = document.getElementById("viewer");
    const viewerImg = document.getElementById("viewerImg");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerText = document.getElementById("viewerText");
    const closeBtn = document.getElementById("closeBtn");

    thumbs.forEach(btn => {
      btn.addEventListener("click", () => {
        viewerImg.src = btn.dataset.full;
        viewerImg.alt = btn.dataset.title || "gallery image";
        viewerTitle.textContent = btn.dataset.title || "";
        viewerText.textContent = btn.dataset.text || "";
        viewer.setAttribute("aria-hidden", "false");
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
      });
    });

    function closeViewer() {
      viewer.setAttribute("aria-hidden", "true");
      viewerImg.src = "";
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeViewer);

    viewer.addEventListener("click", (e) => {
      if (e.target === viewer) closeViewer();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && viewer.getAttribute("aria-hidden") === "false") {
        closeViewer();
      }
    });
  </script>
</body>
</html>
