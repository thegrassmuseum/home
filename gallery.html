<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gallery — the grass museum</title>

  <style>
    :root{
      --fade-duration: 6s;
      --stagger-delay: 600ms;
      --viewer-fade: 600ms;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      color: #111;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
    }

    /* ===== PAGE ===== */
    .page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      transition: opacity 300ms ease;
    }

    .page.fade-out {
      opacity: 0;
    }

    /* ===== THUMB STRIP ===== */
    .strip {
      display: flex;
      gap: 40px;
      justify-content: center;
    }

    .thumb {
      width: 280px;
      aspect-ratio: 1 / 1;
      opacity: 0;
      animation: fadeIn var(--fade-duration) ease forwards;
      animation-delay: var(--d, 0ms);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ===== MINI MAP ===== */
    .mini-map-wrapper{
      position: fixed;
      top: 16px;
      right: 16px;
      pointer-events: none;
    }

    .mini-map {
      font-size: 11px;
      line-height: 1.25;
      white-space: pre;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(.16,1,.3,1);
      margin: 0;
    }

    .mini-map.visible {
      opacity: 0.75;
    }

    /* EXIT hotspot — YOUR MEASUREMENTS */
    .mini-exit {
      position: absolute;
      top: 1.5em;
      left: 0ch;
      width: 2ch;
      height: 1em;
      pointer-events: auto;
      cursor: pointer;
    }

    /* GIFT SHOP hotspot — YOUR MEASUREMENTS */
    .mini-gift {
      position: absolute;
      top: 3em;
      left: 2ch;
      width: 6ch;
      height: 1em;
      pointer-events: auto;
      cursor: pointer;
    }

    /* ===== ENTERING TEXT ===== */
    .entering {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }

    .entering.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <main class="page" id="page">
    <section class="strip">
      <div class="thumb" style="--d:0ms"><img src="images/01.jpeg"></div>
      <div class="thumb" style="--d:600ms"><img src="images/02.jpeg"></div>
      <div class="thumb" style="--d:1200ms"><img src="images/03.jpeg"></div>
      <div class="thumb" style="--d:1800ms"><img src="images/04.jpeg"></div>
      <div class="thumb" style="--d:2400ms"><img src="images/05.jpeg"></div>
    </section>
  </main>

  <!-- MINI MAP -->
  <div class="mini-map-wrapper">
    <pre class="mini-map" id="miniMap">
   gallery ×
      |
exit──┼──garden
      |
  gift shop
    </pre>

    <a class="mini-exit" href="index.html" aria-label="back to vestibule"></a>
    <a class="mini-gift" href="gift-shop.html" aria-label="enter gift shop"></a>
  </div>

  <!-- ENTERING TEXT -->
  <div class="entering" id="entering">entering gift shop...</div>

  <script>
    const miniMap = document.getElementById("miniMap");
    const page = document.getElementById("page");
    const entering = document.getElementById("entering");
    const giftLink = document.querySelector(".mini-gift");

    // show mini map after thumbnails finish
    document.querySelectorAll(".thumb").at(-1)
      .addEventListener("animationend", () => {
        miniMap.classList.add("visible");
      }, { once:true });

    // gift shop transition
    giftLink.addEventListener("click", (e) => {
      e.preventDefault();

      // fade everything out
      page.classList.add("fade-out");
      miniMap.classList.remove("visible");

      setTimeout(() => {
        entering.classList.add("show");
      }, 150);

      setTimeout(() => {
        window.location.href = giftLink.href;
      }, 900);
    });
  </script>

</body>
</html>
